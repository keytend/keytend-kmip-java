# The keytend-kmip-server build every live tool runs, and the release gate's probe is pinned to
# (docs/releasing.md, step 1). tools/kmip-server/run-server.sh reads it: it starts only the image
# whose ID is image_id, and loads a Docker archive only if its SHA-256 is archive_sha256, unless
# told the image is unpinned (KEYTEND_SERVER_UNPINNED=1, release-check.sh's --server-unpinned,
# which records the check as UNPIN). Change the lines together, after the probe passed against the
# new image, and update docs/releasing.md (ServerPinTest compares them).
#
# The release's assets are container images only (no native binary). The values below come from
# the release's files: release_asset_sha256 is the outer tar's .sha256 asset (and its SHA-256);
# archive_sha256, image, image_id and source_commit are release/linux-amd64/image.json's sha256,
# image_tag, image_id and source_commit (archive_sha256 is also the archive's line in SHA256SUMS);
# tag_commit is the commit the tag v<version> names in the repository. The image is built from the
# tagged commit, so source_commit and tag_commit are the same.
# How the pinned files were checked, 2026-11-09: the server repository's own
# scripts/verify_release.sh 0.10.0-rc.1 (at the release tag, RELEASE_BASE=file:// of the downloaded
# assets) passed and loaded the image; then by hand: the outer tar against its .sha256 asset; the
# inner release/SHA256SUMS, .asc and .sigstore.json identical to the outer assets, and every entry
# checked (sha256sum -c); SHA256SUMS.asc a good OpenPGP signature by the release subkey
# CE9BFF243C9F66C2A2129E3AB02F69EFAEB7DBB5 of 3A84912AFBE7D2B04EBA2A8A51E65DD49C6F987F (gpg
# --verify). verify_release.sh checks the Sigstore bundle with its pinned cosign, in the directory
# holding the assets:
#   cosign verify-blob --key cosign.pub --insecure-ignore-tlog=true \
#     --bundle SHA256SUMS.sigstore.json SHA256SUMS
# The archive is the linux/amd64 image; `podman load -i` of it gives the image tag and ID below.

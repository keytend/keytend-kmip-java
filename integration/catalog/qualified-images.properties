# SHA-256 of that image's RootFS.Layers (one diff ID per line). KmsSamplesIT.PYKMIP_BUILD and the
# interop suites' PyKMIP limitations match layers:<this>:<configuration>, so a relabeled rebuild
# from the same cached layers (another image ID) keeps them; any change to the server's files drops
# them.
pykmip.layers=b75ccb50552a827d6271b2eccbc796e6c90c6318be18ec6b8c56180d5cc67dd7

# Exact local images the catalog and the sample runs were qualified on.
# Build from source by omitting -Dkmip.catalog.imagesFile.

# Every image re-qualified 2026-11-07 (UTC). The images were built through the Docker-compatible
# API, as Testcontainers builds them: Podman caches API builds apart from podman-build ones, so only
# then does a test rebuild reuse the qualified image.
#
# PyKMIP re-pinned 2026-11-10 (UTC): its Dockerfile now pins every package, and this image of it
# holds the same files as the image the catalog was qualified on (sha256:3900a0e8...), whose
# pykmip.files are these.
pykmip.image=sha256:e64c720db6fbdb89d7e9576b1f3e3def0b6e4696993a4dccfbc5ad1608596071

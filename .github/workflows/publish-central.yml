# Deploy a published GitHub release to Maven Central (docs/releasing.md, step 3).
#
# Publishing a release X.Y.Z starts it; a pre-release X.Y.Z-rc.N never goes to Central. It
# checks the release's SHA256SUMS signature against the release key, downloads the release's
# signed Central bundle (keytend-kmip-X.Y.Z-central-bundle.zip, which the release workflow made
# from the build the release checks tested), checks it against SHA256SUMS, uploads it to the
# Central Portal as it is, and publishes it once the Portal has validated it
# (tools/central-upload.py). It builds and signs nothing.
#
# A manual run takes a published release's version and "drop" or "publish". "drop" uploads the
# bundle, lets the Portal validate it and drops it, for any version, so nothing reaches Central.
# "publish" is for a release X.Y.Z only. A version on Central can never be changed or removed.
#
# Repository settings: secrets CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD, a Central
# Portal user token of the namespace dev.keytend.
name: publish-central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: A published release's version, without the leading v
        required: true
      action:
        description: drop (validate only) or publish
        required: true
        type: choice
        options: [drop, publish]
        default: drop

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: publish-central
  cancel-in-progress: false

jobs:
  central:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then version=${TAG#v}; action=publish
          else version=$INPUT_VERSION; action=$INPUT_ACTION; fi
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || { echo "::error::not a release version: $version"; exit 1; }
          if [ "$action" = publish ] && [[ $version == *-* ]]; then
            echo "::error::$version is a pre-release: it never goes to Maven Central (run with drop to validate it)"; exit 1
          fi
          case $action in publish|drop) ;; *) echo "::error::action $action is neither drop nor publish"; exit 1 ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ACTION=$action" >> "$GITHUB_ENV"
      # The tools and SECURITY.md from this workflow's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release's Central bundle, verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] \
            || { echo "::error::v$VERSION is not a published release"; exit 1; }
          bundle=keytend-kmip-$VERSION-central-bundle.zip
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/release" \
            -p SHA256SUMS -p SHA256SUMS.asc -p "$bundle"
          export GNUPGHOME=$RUNNER_TEMP/verify
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          # shellcheck disable=SC2016  # the backticks are SECURITY.md's, not a command
          fingerprint=$(sed -n 's/^\*\*Release key fingerprint:\*\* `\([0-9A-F]\{40\}\)`$/\1/p' SECURITY.md)
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$fingerprint"
          # VALIDSIG's last field is the primary key's fingerprint, whichever subkey signed.
          gpg --batch --status-fd 1 --verify "$RUNNER_TEMP/release/SHA256SUMS.asc" "$RUNNER_TEMP/release/SHA256SUMS" \
            | awk -v want="$fingerprint" '$2 == "VALIDSIG" && $NF == want {ok = 1} END {exit !ok}' \
            || { echo "::error::SHA256SUMS is not signed by the release key $fingerprint"; exit 1; }
          (cd "$RUNNER_TEMP/release" && grep -x "[0-9a-f]\{64\}  $bundle" SHA256SUMS | sha256sum -c -)
          echo "BUNDLE=$RUNNER_TEMP/release/$bundle" >> "$GITHUB_ENV"
      - name: Upload to the Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: python3 -I tools/central-upload.py "$BUNDLE" --name "keytend-kmip $VERSION" "--$ACTION"
